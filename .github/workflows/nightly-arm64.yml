name: Nightly arm64-v8a APK

# Builds a signed, installable FOSS release APK for arm64-v8a on every push to main and
# publishes it as a GitHub release, which is what the app's own updater reads.
#
# Signing: one key for every build, kept in the Actions cache (not in the repository, not in
# a secret) so a new APK installs over the previous one instead of demanding an uninstall.
# The cache key is versioned: bump SIGNING_KEY_ID below to deliberately start a new key.
#
# Version: bumped per run, because the in-app updater only offers a release whose dotted
# version is higher than the installed one.

on:
  push:
    branches: [main, player-sheet-motion]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SIGNING_KEY_ID: nightly-signing-key-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release notes are the commits since the last release,
          # so the tag that marks it has to be in the clone.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        uses: actions/cache/restore@v4
        with:
          path: .nightly-signing
          key: ${{ env.SIGNING_KEY_ID }}-${{ github.run_number }}
          restore-keys: ${{ env.SIGNING_KEY_ID }}-

      - name: Make the signing key if this is the first build
        run: |
          set -euo pipefail
          mkdir -p .nightly-signing
          if [ ! -f .nightly-signing/nightly.jks ]; then
            echo "No key in the cache yet - making one. Every later build reuses it."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair \
              -keystore .nightly-signing/nightly.jks \
              -storetype PKCS12 \
              -alias nightly \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Spotify Nightly, O=Nightly, C=IN"
            printf '%s' "$PASS" > .nightly-signing/pass
          fi
          cp .nightly-signing/nightly.jks spotify.jks
          echo "NIGHTLY_KEY_PASS=$(cat .nightly-signing/pass)" >> "$GITHUB_ENV"

      - name: Save the signing key for the next build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .nightly-signing
          key: ${{ env.SIGNING_KEY_ID }}-${{ github.run_number }}

      - name: Set the nightly version
        run: |
          set -euo pipefail
          NAME="2.23.${{ github.run_number }}"
          CODE="$((150 + ${{ github.run_number }}))"
          sed -i "s/^version-name = .*/version-name = \"$NAME\"/" gradle/libs.versions.toml
          sed -i "s/^version-code = .*/version-code = \"$CODE\"/" gradle/libs.versions.toml
          grep -E '^version-(name|code)' gradle/libs.versions.toml
          echo "NIGHTLY_VERSION=$NAME" >> "$GITHUB_ENV"

      - name: Build and sign the release APK (FOSS)
        env:
          KEYSTORE_PASSWORD: ${{ env.NIGHTLY_KEY_PASS }}
          KEY_ALIAS: nightly
          KEY_PASSWORD: ${{ env.NIGHTLY_KEY_PASS }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: Show what was built
        run: ls -lh androidApp/build/outputs/apk/release/

      - name: Write the changelog
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            echo "What's new in $NIGHTLY_VERSION" > notes.md
          else
            RANGE="HEAD~1..HEAD"
            echo "First nightly build of $NIGHTLY_VERSION" > notes.md
          fi
          echo "" >> notes.md
          # "- " bullets, which the in-app sheet turns into its own bullet lines.
          git log "$RANGE" --no-merges --pretty=format:"- %s" >> notes.md
          echo "" >> notes.md
          echo "" >> notes.md
          echo "Install over the previous build; no uninstall needed." >> notes.md
          echo "--- notes ---"
          cat notes.md

      - name: Publish the release the in-app updater reads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="androidApp/build/outputs/apk/release/Spotify-foss-arm64-v8a-release.apk"
          gh release create "v$NIGHTLY_VERSION" \
            "$ASSET#Spotify-Nightly-$NIGHTLY_VERSION-arm64-v8a.apk" \
            --title "Spotify Nightly $NIGHTLY_VERSION" \
            --notes-file notes.md \
            --latest

      - name: Zip the source that produced this APK
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="Spotify-Nightly-$NIGHTLY_VERSION/" \
            -o "Spotify-Nightly-$NIGHTLY_VERSION-source.zip" HEAD
          ls -lh "Spotify-Nightly-$NIGHTLY_VERSION-source.zip"

      - name: Attach the source zip to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "v$NIGHTLY_VERSION" \
            "Spotify-Nightly-$NIGHTLY_VERSION-source.zip" \
            --clobber

      - name: Upload the APK and the source zip as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spotify-nightly-arm64-v8a
          path: |
            androidApp/build/outputs/apk/release/*arm64-v8a*.apk
            Spotify-Nightly-*-source.zip
          if-no-files-found: error
          retention-days: 30
